[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.1",
    "langchain-community>=0.3.20",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "langsmith>=0.3.18",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
ui = ["gradio>=6.17.3"]

[project.scripts]
agentbridge = "agentbridge.cli:main"
agentbridge-gradio = "agentbridge.ui.gradio_app:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
]
notebook = ["ipykernel>=7.2.0", "jupyter>=1.1.1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
