name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Lint
        run: uv run --group dev ruff check .
      - name: Test
        run: uv run --group dev pytest --cov=agentbridge --cov-report=term-missing
